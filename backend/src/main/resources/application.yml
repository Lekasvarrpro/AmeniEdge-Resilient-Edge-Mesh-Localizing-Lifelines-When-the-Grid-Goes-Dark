server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: ameniedge-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:station-edge}

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/ameniedge_station;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ameniedge:
  station:
    id: ${STATION_ID:STA-CHN-N-001}
    name: ${STATION_NAME:Station North Command}
    region-id: ${REGION_ID:REG-CHN-01}
    mode: ${OPERATIONAL_MODE:ISOLATED_EDGE}
    latitude: ${DEFAULT_MAP_LAT:13.0827}
    longitude: ${DEFAULT_MAP_LNG:80.2707}
  security:
    jwt-secret: ${JWT_SECRET:ameniedge_default_development_jwt_secret_key_needs_to_be_at_least_32_bytes_long!}
    jwt-expiration-ms: 86400000 # 24 hours
    hmac-shared-key: ${STATION_SHARED_HMAC_KEY:ameniedge_mesh_hmac_shared_secret_2026}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amenedge}
    username: ${DB_USER:amenedge}
    password: ${DB_PASSWORD:amenedge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
ameniedge:
  station:
    mode: CENTRAL_REGIONAL

---
spring:
  config:
    activate:
      on-profile: central-regional
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amenedge}
    username: ${DB_USER:amenedge}
    password: ${DB_PASSWORD:amenedge}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
ameniedge:
  station:
    mode: CENTRAL_REGIONAL

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:ameniedge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
