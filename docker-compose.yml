version: '3.8'

services:
  ameniedge-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ameniedge-dev-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ameniedge_dev
      - POSTGRES_USER=ameniedge
      - POSTGRES_PASSWORD=ameniedge_dev_secret
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  ameniedge-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ameniedge-dev-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://ameniedge-db:5432/ameniedge_dev
      - DB_USER=ameniedge
      - DB_PASSWORD=ameniedge_dev_secret
      - JWT_SECRET=ameniedge_development_secret_key_at_least_256_bits_long_for_hmac_sha256
    depends_on:
      - ameniedge-db

  ameniedge-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ameniedge-dev-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - ameniedge-backend

volumes:
  dev_postgres_data:
