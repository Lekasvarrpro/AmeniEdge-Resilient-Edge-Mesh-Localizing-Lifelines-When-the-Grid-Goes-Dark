# ==============================================================================
# hostapd configuration for AmeniEdge Station Edge Autonomous Wi-Fi AP
# Hardware: Raspberry Pi onboard Wi-Fi or USB Wi-Fi Dongle (nl80211)
# ==============================================================================

interface=wlan0
driver=nl80211
ssid=AmeniEdge-Station-North-SOS
hw_mode=g
channel=7
wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# Open access network for emergency victim connectivity (Zero WPA2 pass needed)
# Security relies on station application auth for responders and guest SOS for victims.
