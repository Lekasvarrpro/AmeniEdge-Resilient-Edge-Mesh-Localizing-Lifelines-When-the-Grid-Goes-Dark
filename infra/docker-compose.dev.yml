services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ameniedge-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amenedge}
      POSTGRES_USER: ${POSTGRES_USER:-amenedge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amenedge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ameniedge_dev_pgdata:/var/lib/postgresql/data
      - ../backend/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../backend/src/main/resources/db/migration/V2__seed_demo_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amenedge} -d ${POSTGRES_DB:-amenedge}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ameniedge_dev_pgdata:
    driver: local

