# ==============================================================================
# dnsmasq configuration for AmeniEdge Captive Portal & Local DNS
# Assigns IPs to connecting devices and redirects all DNS queries to Station IP
# ==============================================================================

# Bind strictly to local edge Wi-Fi interface
interface=wlan0
except-interface=lo
bind-interfaces

# DHCP IP allocation pool (192.168.4.50 to 192.168.4.250)
dhcp-range=192.168.4.50,192.168.4.250,255.255.255.0,12h

# Gateway option (Station Edge IP)
dhcp-option=3,192.168.4.1

# DNS Server option (Station Edge IP)
dhcp-option=6,192.168.4.1

# Domain name
domain=ameniedge.local

# Wildcard DNS Spoofing: Every requested domain resolves to the Station Edge IP
# This guarantees that any mobile phone connecting to the Wi-Fi triggers captive portal
address=/#/192.168.4.1

