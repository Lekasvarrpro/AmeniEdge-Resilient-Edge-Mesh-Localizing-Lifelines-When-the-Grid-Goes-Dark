# ==============================================================================
# AmeniEdge Station Edge Deployment Stack (Autonomous Island Mode)
# Runs on Linux Device (Raspberry Pi 4/5 or Field Laptop) behind hostapd/dnsmasq
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Static Asset Gateway
  # Serves React PWA, routes /api/v1 to backend, /ws to STOMP WebSocket,
  # and /api/v1/maps/tiles to the local tile repository.
  # ----------------------------------------------------------------------------
  edge-proxy:
    image: nginx:alpine
    container_name: ameniedge-edge-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../map-data/tiles:/usr/share/nginx/tiles:ro
    depends_on:
      edge-backend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Local Station Spring Boot Engine
  # Autonomous REST, STOMP WebSockets, RescueFit rules engine, and Sync Outbox
  # ----------------------------------------------------------------------------
  edge-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ameniedge-edge-backend
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=station-edge
      - STATION_ID=STA-CHN-N-001
      - STATION_NAME=Station North Command
      - REGION_ID=REG-CHN-01
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://edge-db:5432/ameniedge_station
      - DB_USER=ameniedge
      - DB_PASSWORD=ameniedge_offline_secret
      - JWT_SECRET=ameniedge_disaster_mesh_super_secret_jwt_key_2026_station_north_secure
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      edge-db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Local Station Database (PostgreSQL with PostGIS)
  # ----------------------------------------------------------------------------
  edge-db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ameniedge-edge-db
    restart: always
    environment:
      - POSTGRES_DB=ameniedge_station
      - POSTGRES_USER=ameniedge
      - POSTGRES_PASSWORD=ameniedge_offline_secret
    volumes:
      - edge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ameniedge -d ameniedge_station"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  edge_postgres_data:

