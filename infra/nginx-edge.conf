server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Captive Portal detection probes redirection
    # Apple iOS / macOS Captive Portal Probe
    location /hotspot-detect.html {
        return 302 http://$host/sos;
    }

    # Android / Google Captive Portal Probes
    location /generate_204 {
        return 302 http://$host/sos;
    }
    location /gen_204 {
        return 302 http://$host/sos;
    }

    # Windows Captive Portal Probe
    location /ncsi.txt {
        return 302 http://$host/sos;
    }
    location /connecttest.txt {
        return 302 http://$host/sos;
    }

    # Offline Leaflet Map Tiles
    location /api/v1/maps/tiles/ {
        alias /usr/share/nginx/tiles/;
        try_files $uri $uri.png =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # REST API Reverse Proxy
    location /api/v1/ {
        proxy_pass http://edge-backend:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP WebSocket Reverse Proxy
    location /ws {
        proxy_pass http://edge-backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Single Page Application (PWA) Client Routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Service Worker and Manifest caching rules
    location /sw.js {
        add_header Cache-Control "no-cache";
    }
    location /manifest.json {
        add_header Cache-Control "no-cache";
    }
}

