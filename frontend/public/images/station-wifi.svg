<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="stationGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Wi-Fi Concentric Radiating Arcs -->
  <path d="M 60 45 A 50 50 0 0 1 140 45" fill="none" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 72 60 A 35 35 0 0 1 128 60" fill="none" stroke="#3B82F6" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 85 75 A 20 20 0 0 1 115 75" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="85" r="5" fill="#2563EB"/>

  <!-- Station Antenna Mast -->
  <line x1="100" y1="85" x2="100" y2="120" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="120" x2="112" y2="120" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Command Post Building -->
  <rect x="55" y="118" width="90" height="60" rx="8" fill="url(#stationGrad)"/>
  <!-- Door -->
  <rect x="88" y="146" width="24" height="32" rx="4" fill="#1E293B"/>
  <!-- Windows -->
  <rect x="66" y="130" width="16" height="16" rx="3" fill="#93C5FD"/>
  <rect x="118" y="130" width="16" height="16" rx="3" fill="#93C5FD"/>

  <!-- Live Mesh Indicator Dot -->
  <circle cx="100" cy="126" r="4" fill="#10B981"/>
</svg>

