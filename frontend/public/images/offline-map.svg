<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Map Fold Canvas -->
  <polygon points="20,40 68,25 132,45 180,30 180,165 132,180 68,160 20,175" fill="url(#mapBg)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Fold Segments Shading -->
  <polygon points="68,25 132,45 132,180 68,160" fill="#000000" opacity="0.03"/>

  <!-- Contour / Road Grid Lines -->
  <path d="M 30 90 Q 70 70 120 100 T 170 85" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 40 130 Q 90 120 140 145" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Hazard Flood Polygon (Inundation Zone) -->
  <polygon points="50,110 85,95 105,125 70,140" fill="#3B82F6" opacity="0.25"/>
  <polygon points="50,110 85,95 105,125 70,140" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Shelter Location Pin -->
  <g transform="translate(132, 85)">
    <path d="M 0 0 C -8 0 -14 6 -14 14 C -14 24 0 38 0 38 C 0 38 14 24 14 14 C 14 6 8 0 0 0 Z" fill="#059669"/>
    <circle cx="0" cy="13" r="5" fill="#FFFFFF"/>
    <!-- Cross in pin -->
    <rect x="-3" y="12" width="6" height="2" fill="#059669"/>
    <rect x="-1" y="10" width="2" height="6" fill="#059669"/>
  </g>

  <!-- Offline Cache Pill -->
  <g transform="translate(62, 148)">
    <rect x="0" y="0" width="76" height="20" rx="10" fill="#1E293B"/>
    <text x="38" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">OFFLINE TILES</text>
  </g>
</svg>

