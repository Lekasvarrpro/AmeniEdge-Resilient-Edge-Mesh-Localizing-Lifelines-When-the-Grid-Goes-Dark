<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="80" fill="url(#bgGrad)" stroke="#BBF7D0" stroke-width="2"/>

  <!-- Helping Hands Silhouette -->
  <g transform="translate(60, 60)">
    <!-- Heart / Life symbol -->
    <path d="M 40 18 C 30 5 15 15 15 28 C 15 42 35 55 40 60 C 45 55 65 42 65 28 C 65 15 50 5 40 18 Z" fill="#DC2626"/>

    <!-- Responder Arm extending -->
    <path d="M 0 50 C 15 45 25 45 35 48" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <!-- Citizen Hand meeting -->
    <path d="M 80 50 C 65 45 55 45 45 48" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Resolved Status Checkmark Pill -->
  <g transform="translate(60, 136)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="#059669"/>
    <circle cx="16" cy="12" r="6" fill="#FFFFFF"/>
    <path d="M 13 12 L 15 14 L 19 10" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">RESOLVED</text>
  </g>
</svg>

