<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="boatGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky Canvas -->
  <rect width="600" height="400" rx="24" fill="url(#skyGrad)"/>

  <!-- Background Radio Tower with Mesh Rings -->
  <g transform="translate(110, 80)">
    <line x1="0" y1="90" x2="0" y2="20" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-20" y1="90" x2="0" y2="20" stroke="#94A3B8" stroke-width="3"/>
    <line x1="20" y1="90" x2="0" y2="20" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="0" cy="18" r="6" fill="#DC2626"/>
    <!-- Signal waves -->
    <path d="M -16 6 A 20 20 0 0 1 16 6" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -28 -4 A 35 35 0 0 1 28 -4" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M -40 -14 A 50 50 0 0 1 40 -14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Distant submerged silhouettes -->
  <rect x="50" y="220" width="40" height="60" rx="4" fill="#94A3B8" opacity="0.5"/>
  <polygon points="50,220 70,200 90,220" fill="#64748B" opacity="0.6"/>
  <rect x="480" y="200" width="55" height="80" rx="4" fill="#94A3B8" opacity="0.5"/>
  <polygon points="480,200 507,180 535,200" fill="#64748B" opacity="0.6"/>

  <!-- Water Surface Waves -->
  <path d="M 0 260 Q 150 240 300 260 T 600 260 L 600 400 L 0 400 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <path d="M 0 280 Q 140 295 280 280 T 600 285 L 600 400 L 0 400 Z" fill="#1E40AF"/>

  <!-- Rescue Inflatable Zodiac Boat -->
  <g transform="translate(230, 210)">
    <!-- Hull Shadow -->
    <ellipse cx="75" cy="55" rx="90" ry="14" fill="#0F172A" opacity="0.2"/>
    <!-- Hull -->
    <path d="M -15 30 C 10 50 140 50 165 30 C 175 20 160 10 140 12 L 10 12 C -10 10 -25 20 -15 30 Z" fill="url(#boatGrad)"/>
    <rect x="5" y="14" width="140" height="8" rx="4" fill="#991B1B"/>
    <!-- Outboard Engine -->
    <rect x="-24" y="6" width="16" height="26" rx="3" fill="#1E293B"/>
    <!-- Rescue Team Responders -->
    <!-- Responder 1 (Pilot) -->
    <circle cx="25" cy="-2" r="12" fill="#F8FAFC"/>
    <path d="M 12 12 C 12 2 38 2 38 12 Z" fill="#2563EB"/>
    <!-- Life vest -->
    <rect x="17" y="4" width="16" height="8" rx="2" fill="#F59E0B"/>
    <!-- Helmet -->
    <path d="M 15 -2 A 10 10 0 0 1 35 -2 Z" fill="#DC2626"/>

    <!-- Responder 2 (Paramedic / Navigator) -->
    <circle cx="75" cy="-8" r="12" fill="#F8FAFC"/>
    <path d="M 62 8 C 62 -2 88 -2 88 8 Z" fill="#2563EB"/>
    <rect x="67" y="0" width="16" height="8" rx="2" fill="#F59E0B"/>
    <path d="M 65 -8 A 10 10 0 0 1 85 -8 Z" fill="#DC2626"/>

    <!-- Citizen in safety blanket -->
    <circle cx="120" cy="4" r="10" fill="#FDE68A"/>
    <path d="M 108 14 C 108 8 132 8 132 14 Z" fill="#E2E8F0"/>
    <polygon points="112,6 128,6 120,16" fill="#FBBF24"/>
  </g>

  <!-- Lifeline Connection Beams / Mesh Indicator -->
  <g transform="translate(380, 70)">
    <rect x="0" y="0" width="170" height="58" rx="16" fill="#FFFFFF" filter="url(#softGlow)"/>
    <circle cx="26" cy="29" r="12" fill="#DC2626"/>
    <path d="M 26 21 L 26 31 M 26 34 L 26 37" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="48" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#0F172A">SOS ACTIVE</text>
    <text x="48" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#059669">● Station Mesh Sync</text>
  </g>
</svg>

