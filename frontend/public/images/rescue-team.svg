<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <!-- Background Safety Shield -->
  <path d="M 100 20 C 145 20 165 40 165 95 C 165 140 125 170 100 180 C 75 170 35 140 35 95 C 35 40 55 20 100 20 Z" fill="url(#shieldGrad)" stroke="#BFDBFE" stroke-width="2"/>

  <!-- Ambulance / Rescue Truck Silhouette -->
  <g transform="translate(52, 70)">
    <!-- Cabin and Body -->
    <rect x="0" y="20" width="65" height="35" rx="5" fill="#2563EB"/>
    <path d="M 65 30 L 85 30 L 92 45 L 92 55 L 65 55 Z" fill="#1D4ED8"/>
    <!-- Windshield -->
    <polygon points="68,34 82,34 88,44 68,44" fill="#93C5FD"/>
    <!-- Medical / Rescue Cross -->
    <rect x="25" y="28" width="16" height="18" rx="2" fill="#FFFFFF"/>
    <rect x="29" y="32" width="8" height="10" fill="#DC2626"/>
    <rect x="25" y="34" width="16" height="6" fill="#DC2626"/>
    <!-- Emergency Flasher -->
    <rect x="15" y="15" width="12" height="5" rx="2" fill="#DC2626"/>
    <!-- Wheels -->
    <circle cx="20" cy="55" r="9" fill="#0F172A"/>
    <circle cx="20" cy="55" r="4" fill="#E2E8F0"/>
    <circle cx="75" cy="55" r="9" fill="#0F172A"/>
    <circle cx="75" cy="55" r="4" fill="#E2E8F0"/>
  </g>

  <!-- RescueFit Matching Badge Pill -->
  <g transform="translate(62, 138)">
    <rect x="0" y="0" width="76" height="22" rx="11" fill="#059669"/>
    <text x="38" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">RESCUEFIT 98%</text>
  </g>
</svg>

