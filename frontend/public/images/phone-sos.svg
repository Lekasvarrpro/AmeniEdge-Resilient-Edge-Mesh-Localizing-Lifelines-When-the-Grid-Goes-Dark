<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF2F2"/>
      <stop offset="100%" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>

  <!-- Pulse Rings -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#FCA5A5" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.3"/>

  <!-- Phone Chassis -->
  <rect x="62" y="25" width="76" height="150" rx="18" fill="url(#phoneBody)"/>
  <rect x="66" y="32" width="68" height="136" rx="14" fill="url(#screenGrad)"/>

  <!-- Speaker & Camera -->
  <rect x="88" y="36" width="24" height="4" rx="2" fill="#334155"/>
  <circle cx="82" cy="38" r="2" fill="#334155"/>

  <!-- Big Red SOS Button on Screen -->
  <circle cx="100" cy="95" r="26" fill="#DC2626"/>
  <circle cx="100" cy="95" r="22" fill="#EF4444"/>
  <text x="100" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">SOS</text>

  <!-- Offline Cache Checkmark Pill -->
  <rect x="72" y="132" width="56" height="18" rx="9" fill="#059669"/>
  <path d="M 82 141 L 86 145 L 94 137" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="106" y="145" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">SAVED</text>
</svg>

